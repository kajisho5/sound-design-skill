name: tests
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *"   # daily: a new ffmpeg-skill release on main is exercised without a commit here
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not -latest: Ubuntu 26.04 runners have no Python 3.9.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pyflakes
      - run: python -m pyflakes src tests
      - run: python -m unittest discover -s tests -v
      - run: sound-design contract --json
      - run: sound-design skill --json
      - name: doctor (no engine, no ffmpeg-skill here; exit 1 = status fail is expected)
        shell: bash
        run: sound-design doctor --json --ffmpeg-skill "$RUNNER_TEMP/none" > doctor.json || test $? -eq 1
      - name: doctor lists ACE-Step and EzAudio as MISSING with an install line, and reports the device
        run: python -c "import json; d=json.load(open('doctor.json', encoding='utf-8')); e=d['checks']['engines']; assert sorted(e)==['acestep','ezaudio'], e; assert all(e[k]['status']=='MISSING' and e[k]['install'] for k in e), e; assert d['checks']['operations']['sfx']['engine']=='ezaudio', d['checks']['operations']; dev=d['checks']['device']; assert dev['status'] in ('OK','CPU_ONLY','UNKNOWN') and 'vram_total_mb' in dev, dev"

  integration:
    # Real FFmpeg from apt, plus read-only checkouts of ffmpeg-skill main (the live contract and probe) and
    # Velisa, the OS (formerly AI-video-production-OS; registry conformance checks). No engine and no weights are installed (ADR-001), so
    # nothing may skip here. Run against ffmpeg-skill main and the 3.0.0 release pinned by commit (ADR-010).
    name: integration (ffmpeg-skill ${{ matrix.ffmpeg_skill.name }})
    strategy:
      fail-fast: false
      matrix:
        ffmpeg_skill:
          - {name: main, ref: main}
          - {name: "3.0.0", ref: 1dc2f52013956daa1d97fd9d9d53c79b9305bc43}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/ffmpeg-skill
          ref: ${{ matrix.ffmpeg_skill.ref }}
          path: vendor/ffmpeg-skill
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/Velisa
          path: vendor/AI-video-production-OS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -e .
      - name: All tests run, none skipped
        env:
          SOUND_DESIGN_FFMPEG_SKILL_DIR: ${{ github.workspace }}/vendor/ffmpeg-skill
          AI_VIDEO_PRODUCTION_OS_DIR: ${{ github.workspace }}/vendor/AI-video-production-OS
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          ! grep -E "\.\.\. skipped" test.log
      - name: doctor against the real ffmpeg-skill (engines MISSING -> degraded, exit 0)
        run: |
          sound-design doctor --json --ffmpeg-skill vendor/ffmpeg-skill | tee doctor.json
          python -c "import json; d=json.load(open('doctor.json', encoding='utf-8')); assert d['status']=='degraded' and d['checks']['ffmpeg_skill']['status']=='OK', d['problems']; assert list(d['checks']['engines'])==['acestep','ezaudio']"
