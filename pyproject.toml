[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-design-skill"
version = "0.1.0"
description = "Music beds (BGM) and sound effects for video, generated by local engines behind availability checks; placed in the mix by audio-production-skill, media work through ffmpeg-skill."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["bgm", "music-generation", "sound-effects", "sfx", "ace-step", "ezaudio", "offline", "agent-skill", "video-production"]
# stdlib only. Engines are not extras on purpose (ADR-001, ADR-002, ADR-005): ACE-Step 1.5 (it pins torch, Python
# 3.11-3.12) and EzAudio (a git checkout with unpinned requirements) are installed in their own environments and found
# by doctor.
dependencies = []

[project.scripts]
sound-design = "sound_design_skill.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/sound-design-skill"

[tool.setuptools.packages.find]
where = ["src"]
